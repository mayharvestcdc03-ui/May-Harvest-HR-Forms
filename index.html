/* ---------- permissions ---------- */
var ROLES = [
  "Administrator",
  "HR",
  "Document Control",
  "Operations Manager",
  "Department Head",
  "Team Leader",
  "Agency Coordinator",
  "Guard on Duty"
];

function role(){
  if (ME && ME.role) return ME.role;
  try {
    var s = sessionStorage.getItem("hr_me");
    if (s) {
      ME = JSON.parse(s);
      if (ME && ME.role) return ME.role;
    }
  } catch(e) {}
  return null;
}

function can(t){
  var r = role();
  if (!r) return false;
  if (r === "Administrator") return true;
  if (r === "Document Control") return t === "doc";
  if (r === "Guard on Duty") return t === "gate";
  
  if (r === "HR") {
    // All access except Document Control and Accounts; Viewing Guard Gate
    return ["approvals", "gate", "dashboard", "status"].indexOf(t) >= 0;
  }
  
  if (r === "Operations Manager") {
    // Viewing only: Dashboard, Guard Gate. Access: Home, Approvals, Status
    return ["approvals", "gate", "dashboard", "status"].indexOf(t) >= 0;
  }
  
  if (r === "Department Head" || r === "Team Leader" || r === "Agency Coordinator") {
    // Respective dept/agency only
    return ["approvals", "gate", "dashboard", "status"].indexOf(t) >= 0;
  }
  
  return false;
}

function inScope(r){
  var x = role();
  if (!x || x === "Administrator" || x === "HR" || x === "Operations Manager" || x === "Guard on Duty" || x === "Document Control") return true;
  if (x === "Agency Coordinator") return r.agency === (ME ? ME.scope : "");
  return r.dept === (ME ? ME.scope : "");
}

function isDirect(r){ return r.agency === AGENCIES[0]; }

function canStampGate(){
  var r = role();
  return r === "Administrator" || r === "Guard on Duty";
}

function canAct(r, a){
  var x = role();
  if (!x) return false;
  var ad = (x === "Administrator" || x === "Operations Manager");
  if (!inScope(r) && !ad) return false;

  var who = {
    Pending: ad || x === "Team Leader",
    Recommended: ad || x === "Department Head",
    Verified: ad || x === "Agency Coordinator" || x === "HR"
  }[r.status];
  
  if (!who) return false;
  var nxt = {
    Pending: "recommend",
    Recommended: "verify",
    Verified: "approve"
  }[r.status];
  
  return a === "reject" || a === nxt;
}

var _colListeners = {};
window._notifyCol = function(col) {
  if (_colListeners[col]) {
    var docs = [];
    if (col === 'audit') {
      docs = (LOCAL_DB.audit || []).map(function(item){ return { id: item.id || '', data: function(){ return item; } }; });
    } else {
      docs = Object.values(LOCAL_DB[col] || {}).map(function(item){ return { id: item.id || '', data: function(){ return item; } }; });
    }
    _colListeners[col].forEach(function(fn) {
      try { fn({ docs: docs }); } catch(err) { console.error(err); }
    });
  }
};

DB = {
  collection: function(col) {
    if (!LOCAL_DB[col]) {
      LOCAL_DB[col] = (col === 'audit') ? [] : {};
    }
    return {
      doc: function(id) {
        return {
          set: function(val) {
            if (col === 'audit') {
              LOCAL_DB.audit = [Object.assign({ id: id }, val)].concat(LOCAL_DB.audit || []).slice(0, 500);
            } else {
              LOCAL_DB[col][id] = Object.assign({}, val, { id: id });
            }
            saveLocalDb();
            window._notifyCol(col);
            return Promise.resolve();
          },
          update: function(val) {
            if (col !== 'audit') {
              LOCAL_DB[col][id] = Object.assign({}, LOCAL_DB[col][id] || { id: id }, val);
            }
            saveLocalDb();
            window._notifyCol(col);
            return Promise.resolve();
          },
          delete: function() {
            if (LOCAL_DB[col] && LOCAL_DB[col][id]) {
              delete LOCAL_DB[col][id];
              saveLocalDb();
              window._notifyCol(col);
            }
            return Promise.resolve();
          },
          get: function() {
            var item = LOCAL_DB[col] ? LOCAL_DB[col][id] : null;
            return Promise.resolve({
              exists: !!item,
              data: function() { return item; }
            });
          }
        };
      },
      onSnapshot: function(onNext, onError) {
        if (!_colListeners[col]) _colListeners[col] = [];
        _colListeners[col].push(onNext);
        var docs = [];
        if (col === 'audit') {
          docs = (LOCAL_DB.audit || []).map(function(item){ return { id: item.id || '', data: function(){ return item; } }; });
        } else {
          docs = Object.values(LOCAL_DB[col] || {}).map(function(item){ return { id: item.id || '', data: function(){ return item; } }; });
        }
        setTimeout(function() {
          try { onNext({ docs: docs }); } catch(e){}
        }, 0);
      }
    };
  }
};

function sha(x){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(x)).then(function(h){return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")})}
async function login(){
  var u = ($("l_u").value || "").trim().toLowerCase(), p = $("l_p").value;
  var a = USERS.filter(function(x){ return x.id.toLowerCase() == u; })[0];
  if (!a) return setMsg("Invalid username or password.");

  if (!p) {
    setMsg("Please enter your password.");
    if ($("l_p")) $("l_p").focus();
    return;
  }

  var defPass = DEFAULT_HR_PASSWORDS[a.id];
  var legacyPass = LEGACY_HR_PASSWORDS[a.id];
  var enteredHash = await sha(a.salt + p);

  var isMatch = (enteredHash === a.hash) || (defPass && p === defPass) || (legacyPass && p === legacyPass);

  if (!isMatch) {
    return setMsg("Invalid username or password.");
  }

  if (enteredHash !== a.hash) {
    a.hash = enteredHash;
    DB.collection("accounts").doc(a.id).update({ hash: enteredHash });
  }

  // Save or remove remembered password on device
  var rem = $("l_rem") && $("l_rem").checked;
  try {
    var remembered = JSON.parse(localStorage.getItem("mhc_hr_remembered_pw") || "{}");
    if (rem) {
      remembered[u] = p;
      localStorage.setItem("mhc_hr_last_u", u);
    } else {
      delete remembered[u];
    }
    localStorage.setItem("mhc_hr_remembered_pw", JSON.stringify(remembered));
  } catch(e) {}

  ME = { user: a.id, name: a.name, role: a.role, scope: a.scope || "" };
  try { sessionStorage.setItem("hr_me", JSON.stringify(ME)); } catch(e) {}
  log("Login", a.id);
  cur = (a.role === "Document Control") ? "doc" : (a.role === "Guard on Duty") ? "gate" : can("approvals") ? "approvals" : can("dashboard") ? "dashboard" : "gate";
  draw();
}

 var dp=DEPTS.filter(function(d){return l.some(function(r){return r.dept==d})}).map(function(d){return{n:d,f:function(r){return r.dept==d}}});
 P("<div class='panel'><h3>Dashboard</h3><div class='kpis'>"+K("Total requests",l.length)+K("Pending (awaiting TL)",pend)+K("In process (recommended / verified)",proc)+K("Approved / completed",ok)+K("Rejected",rej)+"</div></div>"+
 "<div class='panel' style='margin-top:14px'><h3>Status per agency</h3>"+(ar.length?bars+"<div style='margin-top:8px'>"+legend+"</div>":"<p class='sm'>No data yet.</p>")+"</div>"+
 "<div class='panel wrap' style='margin-top:14px'><h3>Summary per agency \u2014 by status</h3>"+(ar.length?tab(ar,sc,"Agency"):"<p class='sm'>No data yet.</p>")+"</div>"+
 "<div class='panel wrap' style='margin-top:14px'><h3>Summary per agency \u2014 by form</h3>"+(ar.length?tab(ar,fc,"Agency"):"<p class='sm'>No data yet.</p>")+"</div>"+
 "<div class='panel wrap' style='margin-top:14px'><h3>Summary per department</h3>"+(dp.length?tab(dp,sc,"Department"):"<p class='sm'>No data yet.</p>")+"</div>")}
function vStatus(){var l=scoped().filter(function(r){return!FILT||r.status==FILT});
 P("<div class='panel wrap'><h3>Request status</h3><label>Filter</label><select id='flt' onchange='FILT=this.value;vStatus()'>"+[""].concat(STAT).map(function(s){return"<option value='"+s+"'"+(FILT==s?" selected":"")+">"+(s||"All")+"</option>"}).join("")+"</select><table><tr><th>Ref</th><th>Form</th><th>Employee</th><th>Dept / Agency</th><th>Filed</th><th>Status</th><th>Trail</th><th></th></tr>"+
 (l.map(function(r){return"<tr><td>"+esc(r.id)+"</td><td>"+esc(r.title)+"</td><td>"+esc(r.name)+"</td><td>"+esc(r.dept)+"<div class='sm'>"+esc(r.agency)+"</div></td><td>"+dt(r.filed)+"</td><td><span class='bd'>"+esc(r.status)+"</span>"+flag(r)+"</td><td class='sm'>"+(r.history||[]).map(function(h){return esc(h.act)+" \u2013 "+esc(h.by)+(h.remark?" ("+esc(h.remark)+")":"")}).join("<br>")+"</td><td><button class='mini' onclick=\"openReq('"+r.id+"')\">Print</button></td></tr>"}).join("")||"<tr><td colspan='8' class='sm'>No requests.</td></tr>")+"</table></div>")}
function vAccounts(){var rows=USERS.map(function(u,i){return"<tr><td>"+esc(u.name)+"</td><td>"+esc(u.id)+"</td><td>"+esc(u.role)+"</td><td>"+esc(u.scope||"\u2014")+"</td><td><button class='mini' onclick='editUser("+i+")'>Edit</button> <button class='mini' onclick='delUser("+i+")'>"+(PEND===i?"Click again to confirm":"Delete")+"</button></td></tr>"}).join("")||"<tr><td colspan='5' class='sm'>No accounts yet.</td></tr>";
 P("<div class='panel'><h3>Create or update account</h3><p class='sm'>Roles: Administrator (full access, accounts, document control); Document Control (Document Control tab only); HR (final approval, dashboard and status, no account or document control access); Agency Coordinator (final approval, dashboard and status for their agency); Team Leader (recommend, their area); Department Head (verify, their department); Guard on Duty (permit entry / exit only). Use an existing username to change its password or scope.</p>"+
 "<div class='row'><div><label>Full name</label><input id='u_name'></div><div><label>Username</label><input id='u_user' autocomplete='off'></div></div><div class='row'><div><label>Role</label><select id='u_role' onchange='scopeOpts()'>"+ROLES.map(function(r){return"<option>"+r+"</option>"}).join("")+"</select></div><div><label>Agency / Area (department)</label><select id='u_scope'></select></div></div>"+
 "<div class='row'><div><label>Password (min. 6; leave blank when editing to keep the current one)</label><input id='u_pw' type='password' autocomplete='new-password'></div><div><label>Confirm password</label><input id='u_pw2' type='password' autocomplete='new-password'></div></div><div class='actions'><button class='pri' onclick='addUser()'>Save account</button></div><div class='msg' id='a_msg'></div></div>"+
 "<div class='panel wrap' style='margin-top:14px'><h3>Accounts</h3><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Agency / Area</th><th></th></tr>"+rows+"</table></div>");scopeOpts()}
function scopeOpts(){var r=$("u_role").value,o=r=="Agency Coordinator"?AGENCIES:["Administrator","HR","Guard on Duty","Document Control"].indexOf(r)>=0?[]:DEPTS;$("u_scope").innerHTML=o.length?o.map(function(x){return"<option>"+esc(x)+"</option>"}).join(""):"<option value=''>All</option>"}
function editUser(i){var u=USERS[i];if(role()!="Administrator")return;$("u_name").value=u.name;$("u_user").value=u.id;$("u_role").value=u.role;scopeOpts();$("u_scope").value=u.scope||"";$("u_pw").value="";$("u_pw2").value="";$("u_pw").focus();setMsg("Editing "+u.id+". Enter a new password to change it, or leave it blank to keep the current one.",true)}
function addUser(){var n=$("u_name").value.trim(),u=$("u_user").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""),r=$("u_role").value,sc=$("u_scope").value,p=$("u_pw").value;
 if(role()!="Administrator")return setMsg("Only an Administrator can create or update accounts.");
 if(!n||!u)return setMsg("Enter the full name and a username (letters and numbers).");
 var ex=USERS.filter(function(x){return x.id==u})[0],base={name:n,role:r,scope:sc};
 if(ex&&!p){DB.collection("accounts").doc(u).set(Object.assign({salt:ex.salt,hash:ex.hash,created:ex.created},base)).then(function(){log("Updated account "+u+" ("+r+")");draw();setMsg("Account updated: "+u,true)}).catch(function(){setMsg("Could not save the account.")});return}
 if(p.length<6)return setMsg("Password must be at least 6 characters.");if(p!=$("u_pw2").value)return setMsg("Passwords do not match.");
 var salt=Array.from(crypto.getRandomValues(new Uint8Array(8))).map(function(b){return b.toString(16).padStart(2,"0")}).join("");
 sha(salt+p).then(function(h){return DB.collection("accounts").doc(u).set(Object.assign({salt:salt,hash:h,created:ex?ex.created:new Date().toISOString()},base))}).then(function(){log((ex?"Updated account and password: ":"Created account ")+u+" ("+r+")");draw();setMsg(ex?"Account and password updated: "+u:"Account created: "+u,true)}).catch(function(){setMsg("Could not save the account (needs a secure, signed-in page).")})}
function vPw(){P("<div class='panel' style='max-width:420px'><h3>Change password</h3><label>Current password</label><input id='p_old' type='password' autocomplete='current-password'><label>New password (min. 6)</label><input id='p_new' type='password' autocomplete='new-password'><label>Confirm new password</label><input id='p_new2' type='password' autocomplete='new-password'><div class='actions'><button class='pri' onclick='myPw()'>Update password</button></div><div class='msg' id='a_msg'></div></div>")}
function myPw(){var a=USERS.filter(function(x){return x.id==ME.user})[0],o=$("p_old").value,n=$("p_new").value;
 if(!a)return setMsg("Account not found.");if(n.length<6)return setMsg("New password must be at least 6 characters.");if(n!=$("p_new2").value)return setMsg("Passwords do not match.");
 sha(a.salt+o).then(function(h){if(h!=a.hash)throw 0;var salt=Array.from(crypto.getRandomValues(new Uint8Array(8))).map(function(b){return b.toString(16).padStart(2,"0")}).join("");return sha(salt+n).then(function(h2){return DB.collection("accounts").doc(a.id).update({salt:salt,hash:h2})})}).then(function(){log("Changed own password",a.id);vPw();setMsg("Password updated.",true)}).catch(function(){setMsg("Current password is incorrect, or it could not be saved.")})}
function delUser(i){if(role()!="Administrator")return;if(PEND!==i){PEND=i;vAccounts();return}var u=USERS[i].id;PEND=null;DB.collection("accounts").doc(u).delete().then(function(){log("Deleted account "+u)})}
function vDoc(){var a=SET.app||{},dis=canDoc()?"":" disabled",
 I=function(p,l,t,v){return"<div><label>"+l+"</label><input type='"+(t||"text")+"' data-s='"+p+"' value='"+esc(v)+"'"+dis+"></div>"};
 var forms=FK.map(function(k){var d=SET.forms[k]||{};return"<tr><td>"+FORMS[k].title+"</td><td><input data-s='forms."+k+"' style='display:none'><input value='"+esc(d.code)+"' onchange=\"fset('"+k+"','code',this.value)\" placeholder='e.g. HRF-UT-001'"+dis+"></td><td><input value='"+esc(d.rev)+"' onchange=\"fset('"+k+"','rev',this.value)\" placeholder='00'"+dis+"></td><td><input type='date' value='"+esc(d.eff)+"' onchange=\"fset('"+k+"','eff',this.value)\""+dis+"></td></tr>"}).join("");
 var rv=(SET.rev.list||[]).map(function(x){return"<tr><td>"+esc(x.ver)+"</td><td>"+fmt("date",x.date)+"</td><td>"+esc(x.desc)+"</td><td>"+esc(x.by)+"</td></tr>"}).join("")||"<tr><td colspan='4' class='sm'>No revisions recorded.</td></tr>";
 P("<div class='panel'><h3>Controlled document: HR Forms application</h3><p class='sm'>Manual coding, approval and revision history for this application as a controlled document and its records (supports FSSC 22000 document and record control). "+(canDoc()?"":"Read-only.")+"</p><div class='row'>"+I("app.title","Application title","text",a.title)+I("app.code","Document code (manual)","text",a.code)+"</div><div class='row'>"+I("app.ver","Version / revision","text",a.ver)+I("app.eff","Effectivity date","date",a.eff)+"</div><div class='row'>"+I("app.prep","Prepared by","text",a.prep)+I("app.rev","Reviewed by","text",a.rev)+"</div><div class='row'>"+I("app.appr","Approved by","text",a.appr)+I("app.owner","Document owner / department","text",a.owner)+"</div></div>"+
 "<div class='panel wrap' style='margin-top:14px'><h3>Form register</h3><p class='sm'>Codes print at the top of each form.</p><table><tr><th>Form</th><th>Document code</th><th>Rev.</th><th>Effectivity</th></tr>"+forms+"</table></div>"+
 "<div class='panel wrap' style='margin-top:14px'><h3>Revision history</h3><table><tr><th>Version</th><th>Date</th><th>Description of change</th><th>By</th></tr>"+rv+"</table>"+(canDoc()?"<div class='row'><input id='rv_v' placeholder='Version'><input id='rv_d' type='date'></div><input id='rv_t' placeholder='Description of change' style='margin-top:8px'><div class='row' style='margin-top:8px'><input id='rv_b' placeholder='By'><button class='mini' onclick='addRev()'>Add revision</button></div>":"")+"</div>"+
 "<div class='panel wrap' style='margin-top:14px'><h3>Audit trail (latest 100)</h3><table><tr><th>When</th><th>Who</th><th>Action</th><th>Ref</th></tr>"+(AUD.slice(0,100).map(function(x){return"<tr><td>"+dt(x.ts)+"</td><td>"+esc(x.by)+"</td><td>"+esc(x.act)+"</td><td>"+esc(x.ref)+"</td></tr>"}).join("")||"<tr><td colspan='4' class='sm'>No records.</td></tr>")+"</table></div>")}
function fset(k,f,v){if(!canDoc())return;SET.forms[k]=SET.forms[k]||{};SET.forms[k][f]=v;saveSet("forms")}
function addRev(){if(!canDoc()||!$("rv_v").value.trim())return;SET.rev.list=(SET.rev.list||[]).concat([{ver:$("rv_v").value.trim(),date:$("rv_d").value,desc:$("rv_t").value.trim(),by:$("rv_b").value.trim()}]);saveSet("rev");draw()}
window.addEventListener("beforeprint",function(){window._t=document.title;var d=SET.forms[cur]||{};document.title=(d.code?d.code+" ":"")+(FORMS[cur]?FORMS[cur].title:"")});
window.addEventListener("afterprint",function(){if(window._t)document.title=window._t});
data={agency:AGENCIES[0]};draw();initDb();
</script>
